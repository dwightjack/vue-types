pre-commit:
  parallel: false
  jobs:
    - name: lint
      group:
        parallel: true
        jobs:
          - glob: "*.{mjs,cjs,js,ts}"
            run: pnpm exec oxlint --type-aware {staged_files}
          - glob: "*.{vue}"
            run: pnpm exec eslint {staged_files}
    - name: format
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
