packages:
  - "packages/*"

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lefthook: true

# Security settings
minimumReleaseAge: 10080 # 7 days
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080 # 7 days
minimumReleaseAgeExclude:
  # Renovate security update: nuxt@4.4.7 || 4.5.1
  - nuxt@4.4.7 || 4.5.1
  # Renovate security update: vite@8.0.16
  - vite@8.0.16
