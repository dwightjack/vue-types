name: Snapshot Release

on:
  pull_request:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.label.name }}

permissions: {}

env:
  NPM_CONFIG_PROVENANCE: true

jobs:
  test:
    if: |
      (github.event.label.name == 'release: snapshot')
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Unlabel PR
        run: |
          gh pr edit $PR_NUMBER --remove-label='release: snapshot'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - run: pnpm install
      - run: pnpm test

  pack:
    name: Create and Pack Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false # recommended: avoid cache poisoning
      - run: pnpm install
      - name: Prepare snapshot releases
        run: pnpm changeset version --snapshot
      - name: Build
        run: pnpm build
      - name: Pack packages
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for trusted publishing (npm publish)
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false # recommended: avoid cache poisoning
          registry-url: "https://registry.npmjs.org"
      - name: Download packed artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          path: ${{ format('release-{0}', needs.pack.outputs.pack-dir-artifact-id) }}
      - name: Publish packages
        run: |
          for f in ./$PACK_DIR/*.tgz; do
            echo "Publishing $f..."
            npm publish "$f" --access=public --tag=next
          done
        env:
          PACK_DIR: ${{ format('release-{0}/packages', needs.pack.outputs.pack-dir-artifact-id) }}
      - name: Update the snapshot release PR
        run: |
          VERSIONS=$(cat ./$PACK_DIR/publish-plan.json | jq -r '.plan[][] | .name + "@" + .version')

          echo "Changesets published the following snapshots:" >> msg_body
          echo "\`\`\`" >> msg_body
          echo "$VERSIONS" >> msg_body
          echo "\`\`\`" >> msg_body

          echo "--------"
          cat msg_body
          echo "--------"

          gh pr comment $PR_NUMBER --body-file msg_body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PACK_DIR: ${{ format('release-{0}', needs.pack.outputs.pack-dir-artifact-id) }}
