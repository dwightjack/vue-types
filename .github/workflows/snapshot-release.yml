name: Snapshot Release

on:
  pull_request:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.label.name }}

permissions: {}

env:
  NPM_CONFIG_PROVENANCE: true

jobs:
  test:
    if: |
      (github.event.label.name == 'release: snapshot')
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Unlabel PR
        run: |
          gh pr edit $PR_NUMBER --remove-label='release: snapshot'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - run: pnpm install
      - run: pnpm test

  pack:
    name: Create and Pack Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false # recommended: avoid cache poisoning
      - run: pnpm install
      - name: Prepare snapshot releases
        run: pnpm changeset version --snapshot
      - name: Build
        run: pnpm build
      - name: Pack packages
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out repo (actions/checkout)
      id-token: write # for trusted publishing (changesets/action/publish)
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false # recommended: avoid cache poisoning
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: pnpm install --ignore-scripts # no build/lifecycle scripts in the job holding id-token
      - name: Download packed artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          path: ${{ format('release-{0}', needs.pack.outputs.pack-dir-artifact-id) }}
      - name: Publish packages
        run: |
          pnpm changeset publish --no-git-tag --tag=next --from-pack-dir="$PACK_DIR"
        env:
          PACK_DIR: ${{ format('release-{0}', needs.pack.outputs.pack-dir-artifact-id) }}
      - name: Update the snapshot release PR
        run: |
          VERSIONS=$(cat ./$PACK_DIR/publish-plan.json | jq -r '.plan[][] | .name + "@" + .version')

          echo "Changesets published the following snapshots:" >> msg_body
          echo "\`\`\`" >> msg_body
          echo "$VERSIONS" >> msg_body
          echo "\`\`\`" >> msg_body

          echo "--------"
          cat msg_body
          echo "--------"

          gh pr comment $PR_NUMBER --body-file msg_body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PACK_DIR: ${{ format('release-{0}', needs.pack.outputs.pack-dir-artifact-id) }}
